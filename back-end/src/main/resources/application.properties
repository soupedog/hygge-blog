spring.profiles.active=dev
#最大文件上传限制
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# 是否允许循环依赖
spring.main.allow-circular-references=false
spring.application.name=blog_service
# 指定 spring 托管下的 jackson null 不参与序列化
spring.jackson.default-property-inclusion=non_null
# 配置数据库
hygge.blog.database.url=${database.url}
hygge.blog.database.userName=${database.userName}
hygge.blog.database.password=${database.password}
hygge.blog.database.autoGenerateDdl=false
hygge.blog.database.showSql=false
# 三方平台信息
# IP 数据云自有账号秘钥
third-party.ipdatacloud.ipquery.key=${ipquery.key}
spring.jpa.open-in-view=false
# 配置 ES
hygge.blog.elastic-search.host-and-port=${es.hostPort}
hygge.blog.elastic-search.password=${es.password}
# 全局默认不启用，防止自动激活 @ReactiveElasticsearchRepositoriesAutoConfiguration，人工主动激活 @EnableElasticsearchRepositories
spring.data.elasticsearch.repositories.enabled=false
# 配置日志
hygge.logging.scope-paths.hygge.*=true
hygge.logging.output.mode=CONSOLE
hygge.logging.pattern.colorful.console.enable=true
# 当前系统文件服务对外公开文件的 API 地址前缀
hyyge.blog.file.expose.api.prefix=${file.expose.api.prefix}
# 自有的 Nginx 文件缓存地址前缀
hyyge.blog.file.expose.nginx.prefix=${file.expose.nginx.prefix}
# 默认关闭 API 文档
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.show-actuator=true
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# controller 扫描路径(多个用 "," 隔开)
springdoc.packagesToScan=hygge.blog.controller
# 只匹配满足下列格式的端点(多个用 "," 隔开)
springdoc.pathsToMatch=/blog-service/**
# Tag 默认展示模式(none 代表收起)
springdoc.swagger-ui.docExpansion=none
# Schemas 栏默认展开层次(0 代表收起)
springdoc.swagger-ui.defaultModelsExpandDepth=0
