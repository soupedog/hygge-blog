# (其他系统自行调整)
# 这是 windows 系统文件目录格式，D 盘下 VM_Space 文件夹下的 Docker 文件夹下的 Java_APP 文件夹
file.root-in-server.path=D:/VM_Space/Docker/Java_APP
hygge.blog.database.autoGenerateDdl=true
# 显示 Hibernate 执行的 SQL 模板
hygge.blog.database.showSql=true
# 显示 Hibernate 执行 SQL 的数据绑定等信息
#logging.level.org.hibernate.orm.jdbc.*=trace
# 显示 Hibernate 的数据库事务信息
logging.level.org.hibernate.engine.transaction.internal.*=trace

# 显示 JdbcTemplate 执行的 SQL 模板
logging.level.org.springframework.jdbc.core.JdbcTemplate=debug
# 显示 JdbcTemplate 执行 SQL 的数据绑定等信息
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=trace

# 开启 swagger 页
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
